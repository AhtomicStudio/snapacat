org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
android.useAndroidX=true
# Emulator-only fast builds: compile ONE ABI instead of all four (major speedup).
# Restore "armeabi-v7a,arm64-v8a,x86,x86_64" before building a release APK/AAB.
reactNativeArchitectures=x86_64
hermesEnabled=true

# React Native 0.80+ ships the New Architecture only, so this is not optional —
# but several libraries still gate on the flag being present and TRUE, and read
# it as false when it is absent.
#
# react-native-nitro-modules is one of them: its build.gradle only applies the
# `com.facebook.react` plugin when this is set, so without it the library's
# codegen never runs and .../codegen/jni/ is never created. The app's generated
# Android-autolinking.cmake still `add_subdirectory()`s that path, because nitro
# declares codegenConfig in its package.json — so CMake configure failed with
# "Cannot specify link libraries for target react_codegen_NitroModulesSpec",
# a target that was never defined. That failure blocked every native rebuild,
# which is why the installed APK dated from June.
newArchEnabled=true
