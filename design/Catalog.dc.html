<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; font-family: Nunito, system-ui, sans-serif; }
    a { color: #E67035; } a:hover { color: #C25A26; }
    .px { image-rendering: pixelated; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FAF6F0; font-family: Nunito, system-ui, sans-serif;">

  <!-- ── Header ──────────────────────────────────────────────────────── -->
  <div style="background: #FFF; border-bottom: 1px solid #EAE3DA; padding: 52px 20px 16px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 40px; height: 40px; border-radius: 14px; background: #FAF6F0; border: 1px solid #EAE3DA; display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#E67035" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 25px; font-weight: 700; color: #2C2A29;">Cat-a-log</div>
      </div>
    </div>

    <!-- Progress. A collection game's spine: the number that is NOT hidden,
         because completion is the goal rather than a hidden mechanic. -->
    <div style="margin-top: 14px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 13px; color: #706B67;">Breeds discovered</span>
        <span style="font-family: Quicksand, system-ui, sans-serif; font-size: 15px; font-weight: 700; color: #E67035;">7 <span style="color: #A49E98; font-size: 13px;">/ 20</span></span>
      </div>
      <div style="margin-top: 7px; height: 10px; border-radius: 5px; background: #F0EBE3; overflow: hidden; box-shadow: inset 0 2px 3px rgba(0,0,0,.06);">
        <div style="width: 35%; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #FFA271, #FF8E53);"></div>
      </div>
    </div>
  </div>

  <!-- ── Filter row ──────────────────────────────────────────────────── -->
  <div style="display: flex; gap: 8px; padding: 14px 20px 4px; overflow: hidden;">
    <div style="background: #FF8E53; box-shadow: 0 3px 0 #C25A26; border-radius: 999px; padding: 8px 15px;">
      <span style="font-family: Quicksand, system-ui, sans-serif; font-size: 13px; font-weight: 700; color: #fff;">All</span>
    </div>
    <div style="background: #FFF; border: 1.5px solid #EAE3DA; border-radius: 999px; padding: 8px 15px;">
      <span style="font-family: Quicksand, system-ui, sans-serif; font-size: 13px; font-weight: 700; color: #706B67;">Found</span>
    </div>
    <div style="background: #FFF; border: 1.5px solid #EAE3DA; border-radius: 999px; padding: 8px 15px;">
      <span style="font-family: Quicksand, system-ui, sans-serif; font-size: 13px; font-weight: 700; color: #706B67;">Missing</span>
    </div>
    <div style="background: #FFF; border: 1.5px solid #EAE3DA; border-radius: 999px; padding: 8px 15px;">
      <span style="font-family: Quicksand, system-ui, sans-serif; font-size: 13px; font-weight: 700; color: #706B67;">Rare</span>
    </div>
  </div>

  <!-- ── The book ────────────────────────────────────────────────────── -->
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 14px 20px 0;">

    <!-- Found: seal point -->
    <div style="background: #FFF; border: 1.5px solid #EAE3DA; border-radius: 20px; overflow: hidden; box-shadow: 0 3px 0 rgba(44,42,41,.05), 0 6px 14px rgba(44,42,41,.06);">
      <div style="height: 92px; background: #F6EFE4; display: flex; align-items: flex-end; justify-content: center; position: relative;">
        <div style="position: absolute; bottom: 9px; width: 40px; height: 8px; border-radius: 50%; background: rgba(48,40,30,.14);"></div>
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_sealpoint.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px;"></div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #2C2A29; line-height: 1.25;">Seal Point</div>
        <div style="font-size: 10.5px; color: #706B67; margin-top: 2px;">Mochi &middot; 3 notes</div>
      </div>
    </div>

    <!-- Found: tuxedo, rare frame -->
    <div style="background: #FFF; border: 2px solid #C9A227; border-radius: 20px; overflow: hidden; box-shadow: 0 3px 0 rgba(201,162,39,.18), 0 6px 14px rgba(44,42,41,.06); position: relative;">
      <div style="height: 92px; background: linear-gradient(#FBF3DF, #F6EBD2); display: flex; align-items: flex-end; justify-content: center; position: relative;">
        <div style="position: absolute; bottom: 9px; width: 40px; height: 8px; border-radius: 50%; background: rgba(48,40,30,.14);"></div>
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_tuxedo.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px;"></div>
        <div style="position: absolute; top: 6px; right: 6px; background: #C9A227; border-radius: 999px; padding: 2px 7px;">
          <span style="font-family: Quicksand, system-ui, sans-serif; font-size: 9px; font-weight: 700; color: #fff; letter-spacing: .3px;">RARE</span>
        </div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #2C2A29; line-height: 1.25;">Black Tuxedo</div>
        <div style="font-size: 10.5px; color: #706B67; margin-top: 2px;">Socks &middot; 1 note</div>
      </div>
    </div>

    <!-- Found: calico -->
    <div style="background: #FFF; border: 1.5px solid #EAE3DA; border-radius: 20px; overflow: hidden; box-shadow: 0 3px 0 rgba(44,42,41,.05), 0 6px 14px rgba(44,42,41,.06);">
      <div style="height: 92px; background: #F6EFE4; display: flex; align-items: flex-end; justify-content: center; position: relative;">
        <div style="position: absolute; bottom: 9px; width: 40px; height: 8px; border-radius: 50%; background: rgba(48,40,30,.14);"></div>
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_calico.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px;"></div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #2C2A29; line-height: 1.25;">Calico</div>
        <div style="font-size: 10.5px; color: #706B67; margin-top: 2px;">Patches</div>
      </div>
    </div>

    <!-- Undiscovered silhouettes. The empty slots are the engine of a
         collection game — they are what makes the next cat worth chasing.
         The current screen only lists cats you already have, so it never
         shows you what you're missing. -->
    <div style="background: #F3EDE4; border: 1.5px dashed #DCD3C6; border-radius: 20px; overflow: hidden;">
      <div style="height: 92px; display: flex; align-items: flex-end; justify-content: center; position: relative;">
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_calico.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px; filter: brightness(0) opacity(.16);"></div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #A49E98;">?????</div>
        <div style="font-size: 10.5px; color: #B7B0A7; margin-top: 2px;">Not yet met</div>
      </div>
    </div>

    <div style="background: #F3EDE4; border: 1.5px dashed #DCD3C6; border-radius: 20px; overflow: hidden;">
      <div style="height: 92px; display: flex; align-items: flex-end; justify-content: center;">
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_tuxedo.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px; filter: brightness(0) opacity(.16);"></div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #A49E98;">?????</div>
        <div style="font-size: 10.5px; color: #B7B0A7; margin-top: 2px;">Not yet met</div>
      </div>
    </div>

    <!--
      This slot originally read "Likes shelter". It was cut before shipping,
      because it would have been a lie: spawn chances come from item bonuses
      alone, with no per-breed affinity anywhere in the game. A hint the game
      does not honour is worse than no hint. utils/collection.describeEntry is
      the single place to change once breed affinity actually exists.
    -->
    <div style="background: #F3EDE4; border: 1.5px dashed #DCD3C6; border-radius: 20px; overflow: hidden;">
      <div style="height: 92px; display: flex; align-items: flex-end; justify-content: center;">
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_sealpoint.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px; filter: brightness(0) opacity(.22);"></div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #A49E98;">?????</div>
        <div style="font-size: 10.5px; color: #B7B0A7; margin-top: 2px;">Not yet met</div>
      </div>
    </div>

    <div style="background: #F3EDE4; border: 1.5px dashed #DCD3C6; border-radius: 20px; overflow: hidden;">
      <div style="height: 92px; display: flex; align-items: flex-end; justify-content: center;">
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_calico.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px; filter: brightness(0) opacity(.16);"></div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #A49E98;">?????</div>
        <div style="font-size: 10.5px; color: #B7B0A7; margin-top: 2px;">Not yet met</div>
      </div>
    </div>

    <div style="background: #F3EDE4; border: 1.5px dashed #DCD3C6; border-radius: 20px; overflow: hidden;">
      <div style="height: 92px; display: flex; align-items: flex-end; justify-content: center;">
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_tuxedo.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px; filter: brightness(0) opacity(.16);"></div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #A49E98;">?????</div>
        <div style="font-size: 10.5px; color: #B7B0A7; margin-top: 2px;">Not yet met</div>
      </div>
    </div>

    <div style="background: #F3EDE4; border: 1.5px dashed #DCD3C6; border-radius: 20px; overflow: hidden;">
      <div style="height: 92px; display: flex; align-items: flex-end; justify-content: center;">
        <div class="px" style="width: 74px; height: 74px; background-image: url(./cat_sealpoint.png); background-size: 444px 74px; background-position: 0 0; margin-bottom: 4px; filter: brightness(0) opacity(.16);"></div>
      </div>
      <div style="padding: 8px 9px 10px;">
        <div style="font-family: Quicksand, system-ui, sans-serif; font-size: 11.5px; font-weight: 700; color: #A49E98;">?????</div>
        <div style="font-size: 10.5px; color: #B7B0A7; margin-top: 2px;">Not yet met</div>
      </div>
    </div>
  </div>

  <!-- ── Log CTA, floating ───────────────────────────────────────────── -->
  <div style="position: absolute; left: 20px; right: 20px; bottom: 30px;">
    <div style="background: linear-gradient(#FFA271, #FF8E53); box-shadow: 0 5px 0 #C25A26, 0 12px 22px rgba(255,142,83,.32); border-radius: 20px; height: 56px; display: flex; align-items: center; justify-content: center; gap: 9px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 8.5A2.5 2.5 0 015.5 6h2L9 4h6l1.5 2h2A2.5 2.5 0 0121 8.5v9A2.5 2.5 0 0118.5 20h-13A2.5 2.5 0 013 17.5z"/>
        <circle cx="12" cy="13" r="3.6"/>
      </svg>
      <span style="font-family: Quicksand, system-ui, sans-serif; font-size: 17px; font-weight: 700; color: #fff;">Log a sighting</span>
    </div>
  </div>

  <!-- Fade so the grid runs under the CTA rather than stopping dead -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 130px; background: linear-gradient(transparent, #FAF6F0 62%); pointer-events: none;"></div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
